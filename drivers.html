<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Drivers & Teams - Retro Grand Prix</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%230a0a2e'/><path d='M6,20 L8,14 L12,12 L20,12 L24,14 L26,20 Z' fill='%23e00'/><ellipse cx='16' cy='13' rx='3' ry='2' fill='%23111'/><circle cx='16' cy='12.5' r='1.5' fill='%23ff0'/><rect x='4' y='18' width='3' height='5' rx='1' fill='%23111'/><rect x='25' y='18' width='3' height='5' rx='1' fill='%23111'/><rect x='5' y='10' width='22' height='2' rx='1' fill='%23e00'/></svg>">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="stars" id="stars"></div>
<nav>
  <a href="index.html" class="nav-logo">RETRO GP</a>
  <div class="nav-links">
    <a href="index.html">Home</a>
    <a href="about.html">About</a>
    <a href="howtoplay.html">How to Play</a>
    <a href="drivers.html" class="active">Drivers</a>
    <a href="game.html">Play</a>
  </div>
</nav>

<div class="page">
  <h1>DRIVERS & TEAMS</h1>
  <p style="color:#888; margin-bottom:30px;">20 drivers across 10 teams compete in the Retro Grand Prix.</p>

  <div id="teamList"></div>

  <div style="text-align:center; margin-top:30px;">
    <a href="game.html" class="btn">RACE NOW</a>
  </div>
</div>

<footer>RETRO GRAND PRIX -- A browser-based F1 racing game</footer>

<script>
const TEAMS_DATA = [
  { team: 'Storm Racing', color: '#3671C6', drivers: [
    { name: 'JAKE THUNDER', maxSpeed: 220, accel: 5.3, turnSpeed: 0.40 },
    { name: 'RIKU TANAKA', maxSpeed: 213, accel: 5.4, turnSpeed: 0.42 },
  ]},
  { team: 'Scuderia Fuoco', color: '#E8002D', drivers: [
    { name: 'MARCO VALENTINI', maxSpeed: 218, accel: 5.0, turnSpeed: 0.38 },
    { name: 'DIEGO SANTOS', maxSpeed: 217, accel: 5.2, turnSpeed: 0.40 },
  ]},
  { team: 'Apex Motors', color: '#FF8000', drivers: [
    { name: 'ALEX DRAKE', maxSpeed: 216, accel: 5.5, turnSpeed: 0.45 },
    { name: 'NOAH CHEN', maxSpeed: 214, accel: 5.4, turnSpeed: 0.44 },
  ]},
  { team: 'Titan GP', color: '#27F4D2', drivers: [
    { name: 'VIKTOR BERG', maxSpeed: 215, accel: 5.3, turnSpeed: 0.43 },
    { name: 'LUCA MORETTI', maxSpeed: 212, accel: 5.5, turnSpeed: 0.44 },
  ]},
  { team: 'Emerald Racing', color: '#229971', drivers: [
    { name: 'RAFAEL COSTA', maxSpeed: 210, accel: 4.8, turnSpeed: 0.41 },
    { name: 'KAI MULLER', maxSpeed: 206, accel: 4.9, turnSpeed: 0.40 },
  ]},
  { team: 'Blaze F1', color: '#FF87BC', drivers: [
    { name: 'ANTOINE DUBOIS', maxSpeed: 204, accel: 5.4, turnSpeed: 0.43 },
    { name: 'MATEO RUIZ', maxSpeed: 202, accel: 5.5, turnSpeed: 0.44 },
  ]},
  { team: 'Velocity F1', color: '#64C4FF', drivers: [
    { name: 'FINN HARTLEY', maxSpeed: 200, accel: 5.8, turnSpeed: 0.46 },
    { name: 'OMAR RASHID', maxSpeed: 208, accel: 5.3, turnSpeed: 0.42 },
  ]},
  { team: 'Comet Racing', color: '#6692FF', drivers: [
    { name: 'SVEN NILSSON', maxSpeed: 203, accel: 5.6, turnSpeed: 0.44 },
    { name: 'YUTO KIMURA', maxSpeed: 198, accel: 5.7, turnSpeed: 0.45 },
  ]},
  { team: 'Iron Wolves', color: '#B6BABD', drivers: [
    { name: 'LEON KRAUSE', maxSpeed: 200, accel: 5.6, turnSpeed: 0.44 },
    { name: 'JACK MORRISON', maxSpeed: 197, accel: 5.8, turnSpeed: 0.46 },
  ]},
  { team: 'Zenith GP', color: '#2D826D', drivers: [
    { name: 'ARJUN PATEL', maxSpeed: 198, accel: 5.7, turnSpeed: 0.45 },
    { name: 'ETHAN WOLFE', maxSpeed: 195, accel: 5.9, turnSpeed: 0.47 },
  ]},
];

function bar(value, max, color) {
  const pct = Math.min(100, (value / max) * 100);
  return `<span class="stat-bar-bg"><span class="stat-bar-fill" style="width:${pct}%;background:${color};"></span></span>`;
}

const container = document.getElementById('teamList');
TEAMS_DATA.forEach(team => {
  let html = `<div class="glass">
    <div style="display:flex; align-items:center; gap:10px; margin-bottom:15px;">
      <span class="color-dot" style="background:${team.color}; width:16px; height:16px;"></span>
      <h2 style="margin:0; color:${team.color};">${team.team.toUpperCase()}</h2>
    </div>
    <div class="grid-2">`;

  team.drivers.forEach(d => {
    html += `<div style="background:rgba(255,255,255,0.03); border-radius:10px; padding:12px;">
      <div style="font-size:15px; font-weight:bold; color:#fff; margin-bottom:8px;">${d.name}</div>
      <div style="font-size:11px; color:#aaa; line-height:2;">
        SPD ${bar(d.maxSpeed, 220, team.color)}<br>
        ACC ${bar(d.accel, 6, team.color)}<br>
        HND ${bar((d.turnSpeed - 0.3) * 5, 1, team.color)}
      </div>
    </div>`;
  });

  html += `</div></div>`;
  container.innerHTML += html;
});

// Stars
const starsEl = document.getElementById('stars');
for (let i = 0; i < 80; i++) {
  const s = document.createElement('span');
  s.style.left = Math.random() * 100 + '%';
  s.style.top = Math.random() * 100 + '%';
  s.style.width = (Math.random() * 2 + 1) + 'px';
  s.style.height = s.style.width;
  s.style.animationDelay = Math.random() * 3 + 's';
  starsEl.appendChild(s);
}
</script>
</body>
</html>
