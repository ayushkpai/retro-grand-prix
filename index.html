<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Retro Grand Prix</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #000;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    overflow: hidden;
    font-family: monospace;
  }
  canvas { display: block; image-rendering: pixelated; }
  #ui {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    pointer-events: none;
    display: flex;
    justify-content: center;
    align-items: center;
  }
  #overlay {
    color: #fff;
    text-align: center;
    font-size: 20px;
    pointer-events: auto;
    text-shadow: 2px 2px #000;
  }
  #overlay h1 { font-size: 48px; color: #ff0; margin-bottom: 10px; }
  #overlay .sub { color: #0f0; margin-bottom: 20px; }
  #overlay .start-btn {
    background: #e00;
    color: #fff;
    border: none;
    padding: 12px 35px;
    border-radius: 999px;
    font-size: 20px;
    font-family: monospace;
    cursor: pointer;
    margin-top: 15px;
  }
  #overlay .start-btn:hover { background: #f22; }
  #qualiHud {
    position: absolute;
    top: 10px; left: 50%;
    transform: translateX(-50%);
    font-family: monospace;
    font-size: 16px;
    color: #fff;
    background: rgba(0,0,0,0.7);
    padding: 8px 20px;
    border-radius: 8px;
    display: none;
    text-align: center;
    pointer-events: none;
  }
  #qualiHud .quali-label { color: #f0f; font-weight: bold; }
  #qualiHud .quali-time { color: #0f0; font-size: 28px; font-weight: bold; }
  .quali-grid {
    display: grid;
    grid-template-columns: 40px 12px 1fr 80px;
    gap: 2px 8px;
    font-size: 13px;
    text-align: left;
    max-height: 55vh;
    overflow-y: auto;
    margin: 10px 0;
  }
  .quali-grid .qg-pos { text-align: right; color: #aaa; }
  .quali-grid .qg-color { width: 12px; height: 12px; border-radius: 50%; align-self: center; }
  .quali-grid .qg-name { color: #fff; }
  .quali-grid .qg-time { color: #0f0; font-family: monospace; }
  .quali-grid .qg-player .qg-name { color: #ff0; font-weight: bold; }
  .quali-grid .qg-player .qg-time { color: #ff0; }
  #pitOverlay {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.85);
    display: none;
    justify-content: center;
    align-items: center;
    z-index: 10;
  }
  #pitMenu {
    text-align: center;
    color: #fff;
    font-family: monospace;
  }
  #pitMenu h2 { font-size: 32px; color: #ff0; margin-bottom: 15px; }
  .pit-section { margin: 12px 0; }
  .pit-section label { font-size: 14px; color: #aaa; display: block; margin-bottom: 6px; }
  .tire-options, .fuel-options { display: flex; gap: 10px; justify-content: center; }
  .tire-btn, .fuel-btn {
    padding: 10px 18px;
    border: 2px solid #555;
    background: rgba(255,255,255,0.08);
    color: #fff;
    font-family: monospace;
    font-size: 14px;
    cursor: pointer;
    border-radius: 8px;
    min-width: 80px;
  }
  .tire-btn:hover, .fuel-btn:hover { border-color: #aaa; }
  .tire-btn.selected, .fuel-btn.selected { border-color: #ff0; background: rgba(255,255,0,0.15); }
  .tire-btn .tire-dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; vertical-align: middle; }
  #pitConfirm {
    margin-top: 18px;
    background: #0a0;
    color: #fff;
    border: none;
    padding: 12px 35px;
    border-radius: 999px;
    font-size: 18px;
    font-family: monospace;
    cursor: pointer;
  }
  #pitConfirm:hover { background: #0c0; }
  #tireHud, #fuelHud {
    position: absolute;
    left: 10px;
    font-family: monospace;
    font-size: 12px;
    color: #fff;
    background: rgba(0,0,0,0.7);
    padding: 6px 10px;
    border-radius: 0 8px 8px 0;
    display: none;
  }
  #tireHud { top: 50px; }
  #fuelHud { top: 85px; }
  #pitHint {
    position: absolute;
    bottom: 100px;
    left: 50%;
    transform: translateX(-50%);
    font-family: monospace;
    font-size: 16px;
    color: #ff0;
    background: rgba(0,0,0,0.7);
    padding: 8px 20px;
    border-radius: 999px;
    display: none;
    pointer-events: none;
  }
  .team-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin: 15px 0;
    max-width: 520px;
    max-height: 60vh;
    overflow-y: auto;
  }
  .team-card {
    background: rgba(255,255,255,0.08);
    border: 2px solid rgba(255,255,255,0.2);
    border-radius: 12px;
    padding: 12px;
    cursor: pointer;
    text-align: left;
    font-family: monospace;
    color: #fff;
    transition: border-color 0.15s;
  }
  .team-card:hover { border-color: rgba(255,255,255,0.6); }
  .team-card.selected { border-color: #ff0; background: rgba(255,255,0,0.1); }
  .team-name { font-size: 16px; font-weight: bold; margin-bottom: 6px; }
  .team-color-bar { height: 4px; margin-bottom: 8px; border-radius: 2px; }
  .team-stats { font-size: 11px; color: #aaa; line-height: 1.6; }
  .team-stats .bar-bg { display: inline-block; width: 80px; height: 8px; background: #333; vertical-align: middle; margin-left: 4px; }
  .team-stats .bar-fill { display: block; height: 100%; }

  #leaderboard {
    position: absolute;
    top: 45px; right: 0;
    background: rgba(0,0,0,0.7);
    padding: 8px 12px 8px 14px;
    font-family: monospace;
    font-size: 11px;
    color: #fff;
    pointer-events: none;
    border: 1px solid rgba(255,255,255,0.2);
    border-right: none;
    border-radius: 10px 0 0 10px;
    display: none;
    min-width: 170px;
  }
  #leaderboard .lb-title {
    font-size: 13px;
    font-weight: bold;
    color: #ff0;
    margin-bottom: 4px;
    border-bottom: 1px solid rgba(255,255,255,0.2);
    padding-bottom: 3px;
  }
  #leaderboard .lb-row {
    display: flex;
    justify-content: space-between;
    padding: 1px 0;
    line-height: 1.5;
  }
  #leaderboard .lb-row.player {
    color: #ff0;
    font-weight: bold;
  }
  .lb-pos { width: 22px; text-align: right; margin-right: 6px; }
  .lb-color { display: inline-block; width: 8px; height: 8px; margin-right: 5px; vertical-align: middle; }
  .lb-name { flex: 1; overflow: hidden; white-space: nowrap; }

  #touch-controls {
    position: absolute;
    bottom: 30px;
    left: 0; right: 0;
    display: none;
    justify-content: space-between;
    padding: 0 20px;
    pointer-events: none;
  }
  .touch-btn {
    width: 80px; height: 80px;
    background: rgba(255,255,255,0.15);
    border: 2px solid rgba(255,255,255,0.3);
    border-radius: 50%;
    color: #fff;
    font-size: 32px;
    font-family: monospace;
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: auto;
    user-select: none;
    -webkit-user-select: none;
  }
  .touch-btn:active { background: rgba(255,255,255,0.35); }

  @media (pointer: coarse) {
    #touch-controls { display: flex; }
  }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="leaderboard"></div>
<div id="ui">
  <div id="overlay">
    <h1>RETRO GRAND PRIX</h1>
    <div class="sub">--- F1 RACING 1986 ---</div>
    <div id="menuScreen">
      <div>Arrow Keys / WASD to drive</div>
      <div>Dodge traffic, stay on track!</div>
      <button class="start-btn" id="startBtn">SELECT YOUR DRIVER</button>
    </div>
    <div id="teamScreen" style="display:none;">
      <div style="margin-bottom:10px; color:#aaa;">CHOOSE YOUR DRIVER</div>
      <div class="team-grid" id="teamGrid"></div>
      <button class="start-btn" id="raceBtn" style="display:none;">QUALIFYING</button>
    </div>
    <div id="setupScreen" style="display:none;">
      <div style="margin-bottom:10px; color:#aaa;">RACE SETUP</div>
      <div class="pit-section">
        <label>STARTING TYRE</label>
        <div class="tire-options">
          <button class="tire-btn setup-tire" data-tire="soft"><span class="tire-dot" style="background:#e00;"></span>SOFT</button>
          <button class="tire-btn setup-tire selected" data-tire="medium"><span class="tire-dot" style="background:#ff0;"></span>MEDIUM</button>
          <button class="tire-btn setup-tire" data-tire="hard"><span class="tire-dot" style="background:#fff;"></span>HARD</button>
        </div>
      </div>
      <div class="pit-section">
        <label>STARTING FUEL</label>
        <div class="fuel-options">
          <button class="fuel-btn setup-fuel" data-fuel="low">LOW</button>
          <button class="fuel-btn setup-fuel" data-fuel="medium">MEDIUM</button>
          <button class="fuel-btn setup-fuel selected" data-fuel="full">FULL</button>
        </div>
      </div>
      <button class="start-btn" id="goBtn">START RACE</button>
    </div>
    <div id="qualiResultScreen" style="display:none;">
    </div>
  </div>
</div>
<div id="qualiHud">
  <div class="quali-label">QUALIFYING LAP</div>
  <div class="quali-time" id="qualiTimer">0:00.000</div>
</div>
<div id="tireHud"></div>
<div id="fuelHud"></div>
<div id="pitHint">PIT LANE: Steer LEFT to enter</div>
<div id="pitOverlay">
  <div id="pitMenu">
    <h2>PIT STOP</h2>
    <div class="pit-section">
      <label>TYRE COMPOUND</label>
      <div class="tire-options">
        <button class="tire-btn" data-tire="soft"><span class="tire-dot" style="background:#e00;"></span>SOFT</button>
        <button class="tire-btn" data-tire="medium"><span class="tire-dot" style="background:#ff0;"></span>MEDIUM</button>
        <button class="tire-btn" data-tire="hard"><span class="tire-dot" style="background:#fff;"></span>HARD</button>
      </div>
    </div>
    <div class="pit-section">
      <label>FUEL LOAD</label>
      <div class="fuel-options">
        <button class="fuel-btn" data-fuel="low">LOW</button>
        <button class="fuel-btn" data-fuel="medium">MEDIUM</button>
        <button class="fuel-btn" data-fuel="full">FULL</button>
      </div>
    </div>
    <button id="pitConfirm">GO GO GO!</button>
  </div>
</div>
<div id="touch-controls">
  <div class="touch-btn" id="btnLeft">&lt;</div>
  <div class="touch-btn" id="btnRight">&gt;</div>
</div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const overlay = document.getElementById('overlay');
const startBtn = document.getElementById('startBtn');

let W, H;
function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

// Game constants
const ROAD_WIDTH = 2000;
const SEG_LENGTH = 200;
const TOTAL_SEGMENTS = 1600;
const CAMERA_DEPTH = 1 / Math.tan((80 / 2) * Math.PI / 180);
const DRAW_DISTANCE = 200;
const LAP_LENGTH = TOTAL_SEGMENTS * SEG_LENGTH;
const TOTAL_LAPS = 3;

// Colors - Abu Dhabi twilight desert
const COL_SKY1 = '#0a0a2e';
const COL_SKY2 = '#1a1040';
const COL_GRASS1 = '#c4a55a';
const COL_GRASS2 = '#b89a50';
const COL_ROAD1 = '#444';
const COL_ROAD2 = '#555';
const COL_RUMBLE1 = '#e00';
const COL_RUMBLE2 = '#fff';
const COL_LANE = '#fff';

// Build track segments
const segments = [];
function buildTrack() {
  segments.length = 0;
  for (let i = 0; i < TOTAL_SEGMENTS; i++) {
    let curve = 0;
    let hill = 0;

    // ============================================
    // YAS MARINA CIRCUIT, ABU DHABI (post-2021)
    // 5.281 km, 16 turns, anti-clockwise
    // 1600 segments = 5281m, ~3.3m per segment
    // ============================================

    // --- PIT STRAIGHT (seg 0-300) ~1km, flat out ---

    // --- T1: Heavy braking left (tight, 90°) ---
    if (i > 300 && i < 340) curve = -3.5;

    // --- T2: Quick right (short, opens up) ---
    if (i > 345 && i < 370) curve = 2;

    // --- T3: Medium left ---
    if (i > 375 && i < 410) curve = -2;

    // --- Short straight (seg 410-470) ---

    // --- T4: Right-hander (medium speed) ---
    if (i > 470 && i < 500) curve = 2;

    // --- T5: Left-right chicane (tight, 2nd gear) ---
    if (i > 510 && i < 535) curve = -2.5;
    if (i > 535 && i < 555) curve = 2;

    // --- T6: LEFT HAIRPIN (slowest point, ~80km/h) ---
    if (i > 565 && i < 610) curve = -4;

    // --- T7: Right kink on exit ---
    if (i > 620 && i < 645) curve = 1.5;

    // --- T8-9: Long sweeping left (under the W Hotel) ---
    if (i > 650 && i < 720) curve = -2;

    // --- BACK STRAIGHT (seg 720-1070) ~1.2km, DRS zone, top speed ---

    // --- T10-11: Fast left-right S-curves (2021 redesign, high speed) ---
    if (i > 1070 && i < 1105) curve = -2;
    if (i > 1105 && i < 1140) curve = 2;

    // --- Short straight (seg 1140-1200) ---

    // --- T12-13: Left-right chicane (medium speed, marina section) ---
    if (i > 1200 && i < 1235) curve = -2.5;
    if (i > 1240 && i < 1270) curve = 2;

    // --- T14: Left-hander (medium, 4th gear) ---
    if (i > 1285 && i < 1320) curve = -2;

    // --- Short straight (seg 1320-1380) ---

    // --- T15: Right (medium) ---
    if (i > 1380 && i < 1410) curve = 2;

    // --- T16: Final left onto pit straight ---
    if (i > 1420 && i < 1470) curve = -2.5;

    // --- Final approach to pit straight (seg 1470-1600) ---

    // Abu Dhabi is essentially flat - negligible elevation
    hill = 0;

    segments.push({
      index: i,
      p1: { world: { z: i * SEG_LENGTH, y: hill }, screen: {} },
      p2: { world: { z: (i + 1) * SEG_LENGTH, y: hill }, screen: {} },
      curve: curve,
      color: {
        road: i % 4 < 2 ? COL_ROAD1 : COL_ROAD2,
        grass: i % 4 < 2 ? COL_GRASS1 : COL_GRASS2,
        rumble: i % 4 < 2 ? COL_RUMBLE1 : COL_RUMBLE2,
      },
      cars: [],
    });
  }

  // Smooth hills
  for (let i = 1; i < TOTAL_SEGMENTS; i++) {
    segments[i].p1.world.y = segments[i - 1].p2.world.y;
  }
}

// AI Cars - the 21 other drivers
const AI_CARS = [];

function spawnAICars(gridOrder) {
  AI_CARS.length = 0;
  // gridOrder is an array of TEAMS indices in qualifying order
  // Find player's grid position
  const order = gridOrder || TEAMS.map((_, i) => i);
  let gridPos = 0;
  const playerGridPos = order.indexOf(selectedTeam);

  order.forEach((teamIdx, pos) => {
    if (teamIdx === selectedTeam) return; // skip player
    const driver = TEAMS[teamIdx];
    // Adjust grid position: if AI is behind player, shift up
    const actualPos = pos > playerGridPos ? pos : pos;
    const row = Math.floor(actualPos / 2);
    const col = actualPos % 2;
    const startZ = -(row * SEG_LENGTH * 1.5) - (col * SEG_LENGTH * 0.5);
    AI_CARS.push({
      offset: col === 0 ? -0.35 : 0.35,
      z: startZ,
      speed: (driver.maxSpeed * 0.28) + Math.random() * (driver.maxSpeed * 0.18),
      color: driver.color,
      name: driver.name,
    });
  });

  // Place player at their grid position
  const pRow = Math.floor(playerGridPos / 2);
  const pCol = playerGridPos % 2;
  player.z = -(pRow * SEG_LENGTH * 1.5) - (pCol * SEG_LENGTH * 0.5);
  player.x = pCol === 0 ? -0.35 : 0.35;

  // Shift everyone forward so nobody has negative z (breaks rendering)
  const minZ = Math.min(player.z, ...AI_CARS.map(c => c.z));
  if (minZ < 0) {
    const shift = -minZ + SEG_LENGTH;
    player.z += shift;
    player.lastLapZ += shift;
    AI_CARS.forEach(c => c.z += shift);
  }
}

// F1 Teams
const TEAMS = [
  { name: 'MAX VERSTAPPEN',      color: '#3671C6', accent: '#6699dd', maxSpeed: 220, accel: 5.3, turnSpeed: 0.40, team: 'Red Bull Racing' },
  { name: 'ISACK HADJAR',        color: '#3671C6', accent: '#6699dd', maxSpeed: 213, accel: 5.4, turnSpeed: 0.42, team: 'Red Bull Racing' },
  { name: 'CHARLES LECLERC',     color: '#E8002D', accent: '#ff3333', maxSpeed: 218, accel: 5.0, turnSpeed: 0.38, team: 'Ferrari' },
  { name: 'LEWIS HAMILTON',      color: '#E8002D', accent: '#ff3333', maxSpeed: 217, accel: 5.2, turnSpeed: 0.40, team: 'Ferrari' },
  { name: 'LANDO NORRIS',        color: '#FF8000', accent: '#ffaa33', maxSpeed: 216, accel: 5.5, turnSpeed: 0.45, team: 'McLaren' },
  { name: 'OSCAR PIASTRI',       color: '#FF8000', accent: '#ffaa33', maxSpeed: 214, accel: 5.4, turnSpeed: 0.44, team: 'McLaren' },
  { name: 'GEORGE RUSSELL',      color: '#27F4D2', accent: '#33ffe0', maxSpeed: 215, accel: 5.3, turnSpeed: 0.43, team: 'Mercedes' },
  { name: 'KIMI ANTONELLI',      color: '#27F4D2', accent: '#33ffe0', maxSpeed: 212, accel: 5.5, turnSpeed: 0.44, team: 'Mercedes' },
  { name: 'FERNANDO ALONSO',     color: '#229971', accent: '#00a878', maxSpeed: 210, accel: 4.8, turnSpeed: 0.41, team: 'Aston Martin' },
  { name: 'LANCE STROLL',        color: '#229971', accent: '#00a878', maxSpeed: 206, accel: 4.9, turnSpeed: 0.40, team: 'Aston Martin' },
  { name: 'PIERRE GASLY',        color: '#FF87BC', accent: '#ffaacc', maxSpeed: 204, accel: 5.4, turnSpeed: 0.43, team: 'Alpine' },
  { name: 'FRANCO COLAPINTO',    color: '#FF87BC', accent: '#ffaacc', maxSpeed: 202, accel: 5.5, turnSpeed: 0.44, team: 'Alpine' },
  { name: 'ALEXANDER ALBON',     color: '#64C4FF', accent: '#88ddff', maxSpeed: 200, accel: 5.8, turnSpeed: 0.46, team: 'Williams' },
  { name: 'CARLOS SAINZ JR',     color: '#64C4FF', accent: '#88ddff', maxSpeed: 208, accel: 5.3, turnSpeed: 0.42, team: 'Williams' },
  { name: 'LIAM LAWSON',         color: '#6692FF', accent: '#88aaff', maxSpeed: 203, accel: 5.6, turnSpeed: 0.44, team: 'Racing Bulls' },
  { name: 'ARVID LINDBLAD',      color: '#6692FF', accent: '#88aaff', maxSpeed: 198, accel: 5.7, turnSpeed: 0.45, team: 'Racing Bulls' },
  { name: 'ESTEBAN OCON',        color: '#B6BABD', accent: '#d0d0d0', maxSpeed: 200, accel: 5.6, turnSpeed: 0.44, team: 'Haas F1' },
  { name: 'OLIVER BEARMAN',      color: '#B6BABD', accent: '#d0d0d0', maxSpeed: 197, accel: 5.8, turnSpeed: 0.46, team: 'Haas F1' },
  { name: 'NICO HULKENBERG',     color: '#2D826D', accent: '#44bb99', maxSpeed: 198, accel: 5.7, turnSpeed: 0.45, team: 'Audi' },
  { name: 'GABRIEL BORTOLETO',   color: '#2D826D', accent: '#44bb99', maxSpeed: 195, accel: 5.9, turnSpeed: 0.47, team: 'Audi' },
  { name: 'SERGIO PEREZ',        color: '#1E3D2B', accent: '#4a8866', maxSpeed: 205, accel: 5.2, turnSpeed: 0.41, team: 'Cadillac' },
  { name: 'VALTTERI BOTTAS',     color: '#1E3D2B', accent: '#4a8866', maxSpeed: 202, accel: 5.4, turnSpeed: 0.43, team: 'Cadillac' },
];
let selectedTeam = 0;

// Tire compounds
const TIRES = {
  soft:   { grip: 1.2, speedBonus: 10, wearRate: 0.035, color: '#e00', label: 'SOFT' },
  medium: { grip: 1.0, speedBonus: 0,  wearRate: 0.018, color: '#ff0', label: 'MEDIUM' },
  hard:   { grip: 0.85, speedBonus: -5, wearRate: 0.008, color: '#fff', label: 'HARD' },
};
const FUEL_LEVELS = {
  low:    { weight: 0, capacity: 0.3, label: 'LOW' },
  medium: { weight: -5, capacity: 0.6, label: 'MEDIUM' },
  full:   { weight: -12, capacity: 1.0, label: 'FULL' },
};

// Player state
let player = {};
function resetPlayer() {
  const team = TEAMS[selectedTeam];
  player = {
    x: 0,
    z: 0,
    speed: 0,
    baseMaxSpeed: team.maxSpeed,
    maxSpeed: team.maxSpeed,
    baseAccel: team.accel,
    accel: team.accel,
    brake: 8,
    decel: 3,
    offRoadDecel: 6,
    baseTurnSpeed: team.turnSpeed,
    turnSpeed: team.turnSpeed,
    steerSmooth: 0,
    collisionCooldown: 0,
    lap: 1,
    lastLapZ: 0,
    color: team.color,
    // Tire state
    tire: 'medium',
    tireWear: 0, // 0 = fresh, 1 = dead
    // Fuel state
    fuel: 1.0, // 0 = empty, 1 = full
    fuelLevel: 'full',
    // Pit
    inPitZone: false,
    hasPitted: false,
    pitCooldown: 0,
  };
  applyTireAndFuel();
}

function applyTireAndFuel() {
  const t = TIRES[player.tire];
  const wearFactor = 1 - player.tireWear * 0.5; // at 100% wear, lose 50% grip
  player.turnSpeed = player.baseTurnSpeed * t.grip * wearFactor;
  player.maxSpeed = player.baseMaxSpeed + t.speedBonus + (player.fuel > 0 ? FUEL_LEVELS[player.fuelLevel].weight * player.fuel : -20);
  player.accel = player.baseAccel * (player.fuel > 0 ? 1 : 0.5);
}

// Input
const keys = {};
window.addEventListener('keydown', e => { keys[e.key.toLowerCase()] = true; e.preventDefault(); });
window.addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });

// Touch controls
const touchState = { left: false, right: false };
const btnLeft = document.getElementById('btnLeft');
const btnRight = document.getElementById('btnRight');

btnLeft.addEventListener('touchstart', e => { e.preventDefault(); touchState.left = true; });
btnLeft.addEventListener('touchend', e => { e.preventDefault(); touchState.left = false; });
btnRight.addEventListener('touchstart', e => { e.preventDefault(); touchState.right = true; });

// Project a point (no horizontal offset - that's handled separately)
function project(p, cameraY, cameraZ) {
  const dz = p.world.z - cameraZ;
  if (dz <= 0) { p.screen.scale = 0; return; }
  p.screen.scale = CAMERA_DEPTH / dz;
  p.screen.x = W / 2;
  p.screen.y = H / 2 - (p.screen.scale * (p.world.y - cameraY) * H / 2);
  p.screen.w = p.screen.scale * ROAD_WIDTH * W / 2;
}

// Draw a polygon
function drawPoly(color, x1, y1, w1, x2, y2, w2) {
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.moveTo(x1 - w1, y1);
  ctx.lineTo(x1 + w1, y1);
  ctx.lineTo(x2 + w2, y2);
  ctx.lineTo(x2 - w2, y2);
  ctx.closePath();
  ctx.fill();
}

// Draw F1 car sprite (top-down rear view)
function drawCar(x, y, scale, color, isPlayer) {
  const w = 60 * scale * W / 640;
  const h = 35 * scale * W / 640;

  if (w < 1) return;

  ctx.save();
  ctx.translate(x, y);

  // Shadow underneath
  ctx.fillStyle = 'rgba(0,0,0,0.35)';
  ctx.beginPath();
  ctx.ellipse(0, h * 0.1, w * 1.2, h * 0.25, 0, 0, Math.PI * 2);
  ctx.fill();

  // Rear diffuser
  ctx.fillStyle = '#1a1a1a';
  ctx.fillRect(-w * 0.85, -h * 0.15, w * 1.7, h * 0.25);

  // Rear wheels (wide, exposed)
  ctx.fillStyle = '#111';
  const wheelW = w * 0.3;
  const wheelH = h * 0.9;
  // Left rear wheel
  ctx.fillRect(-w * 1.35, -h * 0.85, wheelW, wheelH);
  ctx.fillStyle = '#333';
  ctx.fillRect(-w * 1.35, -h * 0.45, wheelW, h * 0.08); // tire band
  // Right rear wheel
  ctx.fillStyle = '#111';
  ctx.fillRect(w * 1.05, -h * 0.85, wheelW, wheelH);
  ctx.fillStyle = '#333';
  ctx.fillRect(w * 1.05, -h * 0.45, wheelW, h * 0.08);

  // Rear suspension arms
  ctx.fillStyle = '#444';
  ctx.fillRect(-w * 1.05, -h * 0.5, w * 0.25, h * 0.08);
  ctx.fillRect(w * 0.8, -h * 0.5, w * 0.25, h * 0.08);
  ctx.fillRect(-w * 1.05, -h * 0.3, w * 0.25, h * 0.08);
  ctx.fillRect(w * 0.8, -h * 0.3, w * 0.25, h * 0.08);

  // Main body (tapered nose shape)
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.moveTo(-w * 0.8, 0);
  ctx.lineTo(-w * 0.85, -h * 0.4);
  ctx.lineTo(-w * 0.7, -h * 1.2);
  ctx.lineTo(-w * 0.35, -h * 1.8);
  ctx.lineTo(w * 0.35, -h * 1.8);
  ctx.lineTo(w * 0.7, -h * 1.2);
  ctx.lineTo(w * 0.85, -h * 0.4);
  ctx.lineTo(w * 0.8, 0);
  ctx.closePath();
  ctx.fill();

  // Sidepods
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.moveTo(-w * 0.85, -h * 0.4);
  ctx.lineTo(-w * 1.0, -h * 0.6);
  ctx.lineTo(-w * 0.9, -h * 1.0);
  ctx.lineTo(-w * 0.7, -h * 1.0);
  ctx.closePath();
  ctx.fill();
  ctx.beginPath();
  ctx.moveTo(w * 0.85, -h * 0.4);
  ctx.lineTo(w * 1.0, -h * 0.6);
  ctx.lineTo(w * 0.9, -h * 1.0);
  ctx.lineTo(w * 0.7, -h * 1.0);
  ctx.closePath();
  ctx.fill();

  // Cockpit / halo
  ctx.fillStyle = '#111';
  ctx.beginPath();
  ctx.ellipse(0, -h * 1.1, w * 0.28, h * 0.35, 0, 0, Math.PI * 2);
  ctx.fill();

  // Halo bar
  ctx.strokeStyle = '#555';
  ctx.lineWidth = Math.max(1, w * 0.06);
  ctx.beginPath();
  ctx.moveTo(-w * 0.25, -h * 1.3);
  ctx.lineTo(0, -h * 1.55);
  ctx.lineTo(w * 0.25, -h * 1.3);
  ctx.stroke();

  // Helmet
  ctx.fillStyle = isPlayer ? '#ff0' : '#fff';
  ctx.beginPath();
  ctx.arc(0, -h * 1.15, w * 0.15, 0, Math.PI * 2);
  ctx.fill();

  // Rear wing (big, wide)
  ctx.fillStyle = color;
  ctx.fillRect(-w * 1.1, -h * 0.05, w * 2.2, h * 0.12);
  // Wing endplates
  ctx.fillStyle = '#222';
  ctx.fillRect(-w * 1.15, -h * 0.15, w * 0.08, h * 0.35);
  ctx.fillRect(w * 1.07, -h * 0.15, w * 0.08, h * 0.35);

  // DRS flap
  ctx.fillStyle = '#222';
  ctx.fillRect(-w * 1.0, -h * 0.15, w * 2.0, h * 0.06);

  // Front wheels (smaller, further up)
  ctx.fillStyle = '#111';
  const fwW = w * 0.22;
  const fwH = h * 0.6;
  ctx.fillRect(-w * 1.2, -h * 1.6, fwW, fwH);
  ctx.fillRect(w * 0.98, -h * 1.6, fwW, fwH);

  // Front wing tips
  ctx.fillStyle = color;
  ctx.fillRect(-w * 1.1, -h * 1.85, w * 2.2, h * 0.1);

  // Nose cone
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.moveTo(-w * 0.2, -h * 1.8);
  ctx.lineTo(0, -h * 2.1);
  ctx.lineTo(w * 0.2, -h * 1.8);
  ctx.closePath();
  ctx.fill();

  // Rear light (red strip)
  ctx.fillStyle = '#f00';
  ctx.fillRect(-w * 0.3, h * 0.02, w * 0.6, h * 0.06);

  ctx.restore();
}

// Draw Yas Marina Circuit scenery
function drawScenery(seg, grassY1, grassY2, scale) {
  const idx = seg.index;
  const sf = scale * W / 640;

  // Helper: draw a building
  function bld(x, y, w, h, color, windows) {
    if (w < 1) return;
    ctx.fillStyle = color;
    ctx.fillRect(x - w, y - h, w * 2, h);
    if (windows && w > 3) {
      const rows = Math.min(6, Math.floor(h / (sf * 8)));
      const cols = Math.min(4, Math.floor(w / (sf * 5)));
      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          ctx.fillStyle = (idx + r + c) % 3 === 0 ? '#ffee88' : '#ffe455';
          const wx = x - w * 0.75 + c * (w * 1.5 / cols);
          const wy = y - h * 0.92 + r * (h * 0.85 / rows);
          ctx.fillRect(wx, wy, w * 0.8 / cols, h * 0.4 / rows);
        }
      }
    }
  }

  // Helper: draw palm tree
  function palm(x, y, h, w) {
    if (w < 0.5) return;
    ctx.fillStyle = '#7a5c1e';
    ctx.fillRect(x - w * 0.15, y - h, w * 0.3, h);
    ctx.strokeStyle = '#1e7a1e';
    ctx.lineWidth = Math.max(1, w * 0.25);
    for (let f = -3; f <= 3; f++) {
      ctx.beginPath();
      ctx.moveTo(x, y - h);
      ctx.quadraticCurveTo(x + f * w * 1.2, y - h - w * 0.8, x + f * w * 2, y - h + w * 0.6);
      ctx.stroke();
    }
  }

  // ============================================================
  // PIT STRAIGHT (seg 0-300): Pit wall, team garages, grandstand
  // ============================================================
  if (idx >= 0 && idx <= 300) {
    // Pit wall (left side, low barrier)
    if (idx % 8 === 0) {
      const wx = seg.p1.screen.x - seg.p1.screen.w * 1.15;
      const wh = 15 * sf;
      const ww = 12 * sf;
      if (ww > 0.5) {
        ctx.fillStyle = '#888';
        ctx.fillRect(wx - ww, grassY1 - wh, ww * 2, wh);
      }
    }
    // Grandstand (right side)
    if (idx >= 50 && idx <= 250 && idx % 20 === 0) {
      const gx = seg.p1.screen.x + seg.p1.screen.w * 1.6;
      bld(gx, grassY1, 40 * sf, 50 * sf, '#3a3a5a', true);
    }
    // Yas Viceroy hotel visible in distance (right)
    if (idx >= 100 && idx <= 200 && idx % 40 === 0) {
      const hx = seg.p1.screen.x + seg.p1.screen.w * 2.5;
      bld(hx, grassY1, 25 * sf, 100 * sf, '#1a2a4a', true);
    }
  }

  // ============================================================
  // T1-T3 area (seg 300-420): Grandstands, braking boards
  // ============================================================
  if (idx >= 260 && idx <= 300 && idx % 10 === 0) {
    // Braking distance boards (200m, 150m, 100m, 50m)
    const side = 1;
    const bx = seg.p1.screen.x + side * seg.p1.screen.w * 1.2;
    const bh = 20 * sf;
    const bw = 10 * sf;
    if (bw > 1) {
      ctx.fillStyle = '#fff';
      ctx.fillRect(bx - bw, grassY1 - bh, bw * 2, bh);
      ctx.fillStyle = '#e00';
      const stripes = Math.floor((300 - idx) / 10);
      for (let s = 0; s < Math.min(stripes, 4); s++) {
        ctx.fillRect(bx - bw * 0.7 + s * bw * 0.4, grassY1 - bh * 0.85, bw * 0.3, bh * 0.7);
      }
    }
  }
  if (idx >= 300 && idx <= 420 && idx % 15 === 0) {
    // T1 grandstand (South grandstand)
    const gx = seg.p1.screen.x + seg.p1.screen.w * 1.8;
    bld(gx, grassY1, 35 * sf, 45 * sf, '#3a3a5a', true);
  }

  // ============================================================
  // T5-T6 HAIRPIN area (seg 510-645): Run-off, catch fencing
  // ============================================================
  if (idx >= 555 && idx <= 620 && idx % 12 === 0) {
    // Catch fencing around hairpin
    const side = (idx % 24 === 0) ? -1 : 1;
    const fx = seg.p1.screen.x + side * seg.p1.screen.w * 1.4;
    const fh = 30 * sf;
    const fw = 3 * sf;
    if (fw > 0.5) {
      ctx.fillStyle = '#999';
      ctx.fillRect(fx - fw * 0.3, grassY1 - fh, fw * 0.6, fh);
      ctx.strokeStyle = 'rgba(200,200,200,0.3)';
      ctx.lineWidth = Math.max(0.5, fw * 0.15);
      ctx.strokeRect(fx - fw * 2, grassY1 - fh * 0.9, fw * 4, fh * 0.8);
    }
  }

  // ============================================================
  // T8-9: W HOTEL / YAS VICEROY (seg 650-720)
  // Track passes UNDER the hotel - iconic landmark
  // ============================================================
  if (idx >= 640 && idx <= 730) {
    // W Hotel structure spanning over the track
    if (idx % 5 === 0) {
      const lx = seg.p1.screen.x - seg.p1.screen.w * 1.6;
      const rx = seg.p1.screen.x + seg.p1.screen.w * 1.6;
      const hotelH = 100 * sf;
      const pillarW = 8 * sf;

      if (pillarW > 0.5) {
        // Support pillars
        ctx.fillStyle = '#2a2a4a';
        ctx.fillRect(lx - pillarW, grassY1 - hotelH, pillarW * 2, hotelH);
        ctx.fillRect(rx - pillarW, grassY1 - hotelH, pillarW * 2, hotelH);

        // Hotel canopy spanning over track
        ctx.fillStyle = 'rgba(30,30,60,0.6)';
        ctx.fillRect(lx - pillarW, grassY1 - hotelH, rx - lx + pillarW * 2, hotelH * 0.15);

        // Diamond-pattern LED facade (iconic grid shell)
        ctx.strokeStyle = '#4466aa';
        ctx.lineWidth = Math.max(0.5, sf * 1);
        const span = rx - lx;
        for (let d = 0; d < 4; d++) {
          const dy = grassY1 - hotelH * 0.85 + d * hotelH * 0.18;
          ctx.beginPath();
          ctx.moveTo(lx, dy);
          ctx.lineTo(rx, dy);
          ctx.stroke();
        }

        // Color-changing LED glow on hotel
        const t = performance.now() / 2000;
        const hue = (idx * 5 + t * 60) % 360;
        ctx.fillStyle = `hsla(${hue}, 80%, 50%, 0.15)`;
        ctx.fillRect(lx, grassY1 - hotelH, span, hotelH * 0.12);
      }
    }
  }

  // ============================================================
  // BACK STRAIGHT (seg 720-1070): DRS detection, distance boards
  // ============================================================
  if (idx >= 720 && idx <= 1070) {
    // DRS detection point marker
    if (idx === 750) {
      const dx = seg.p1.screen.x + seg.p1.screen.w * 1.2;
      const dh = 25 * sf;
      const dw = 15 * sf;
      if (dw > 1) {
        ctx.fillStyle = '#0a0';
        ctx.fillRect(dx - dw, grassY1 - dh, dw * 2, dh);
        ctx.fillStyle = '#fff';
        ctx.font = `${Math.max(6, Math.floor(dh * 0.4))}px monospace`;
        ctx.textAlign = 'center';
        ctx.fillText('DRS', dx, grassY1 - dh * 0.4);
      }
    }
    // Palm trees lining the straight
    if (idx % 30 === 0) {
      palm(seg.p1.screen.x - seg.p1.screen.w * 1.5, grassY1, 80 * sf, 10 * sf);
      palm(seg.p1.screen.x + seg.p1.screen.w * 1.5, grassY1, 80 * sf, 10 * sf);
    }
  }

  // ============================================================
  // T10-11 S-CURVES (seg 1070-1140): New 2021 section
  // ============================================================
  if (idx >= 1060 && idx <= 1150 && idx % 12 === 0) {
    const side = (idx % 24 === 0) ? -1 : 1;
    const gx = seg.p1.screen.x + side * seg.p1.screen.w * 1.7;
    bld(gx, grassY1, 30 * sf, 40 * sf, '#3a3a5a', true);
  }

  // ============================================================
  // MARINA SECTION T12-T16 (seg 1200-1470): Yachts, marina, towers
  // ============================================================
  if (idx >= 1180 && idx <= 1480) {
    // Marina water (blue strip on left side)
    if (idx % 6 === 0) {
      const wx = seg.p1.screen.x - seg.p1.screen.w * 1.5;
      const ww = seg.p1.screen.w * 0.6;
      if (ww > 2) {
        ctx.fillStyle = '#0a2a4a';
        ctx.fillRect(wx - ww, grassY1 - 3 * sf, ww * 2, 6 * sf);
      }
    }
    // Yachts in the marina
    if (idx >= 1220 && idx <= 1400 && idx % 25 === 0) {
      const yx = seg.p1.screen.x - seg.p1.screen.w * 1.8;
      const yh = 20 * sf;
      const yw = 12 * sf;
      if (yw > 1) {
        // Hull
        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.moveTo(yx - yw, grassY1 - yh * 0.3);
        ctx.lineTo(yx + yw, grassY1 - yh * 0.3);
        ctx.lineTo(yx + yw * 0.7, grassY1);
        ctx.lineTo(yx - yw * 0.7, grassY1);
        ctx.closePath();
        ctx.fill();
        // Mast
        ctx.fillStyle = '#aaa';
        ctx.fillRect(yx - sf * 0.5, grassY1 - yh, sf, yh * 0.7);
        // Cabin light
        ctx.fillStyle = '#ffee88';
        ctx.fillRect(yx - yw * 0.3, grassY1 - yh * 0.5, yw * 0.6, yh * 0.15);
      }
    }
    // Marina residential towers (right side)
    if (idx % 20 === 0) {
      const tx = seg.p1.screen.x + seg.p1.screen.w * 2;
      const th = (70 + (idx % 60) * 1.5) * sf;
      bld(tx, grassY1, 20 * sf, th, '#1e2844', true);
    }
    // Palm trees along marina
    if (idx % 18 === 0) {
      palm(seg.p1.screen.x + seg.p1.screen.w * 1.4, grassY1, 70 * sf, 8 * sf);
    }
  }

  // ============================================================
  // FLOODLIGHTS - entire track (night race, every 35 segments)
  // ============================================================
  if (idx % 35 === 0) {
    const lx1 = seg.p1.screen.x - seg.p1.screen.w * 1.25;
    const lx2 = seg.p1.screen.x + seg.p1.screen.w * 1.25;
    const lH = 65 * sf;
    const lW = 3 * sf;
    if (lW > 0.3) {
      // Steel poles
      ctx.fillStyle = '#777';
      ctx.fillRect(lx1 - lW * 0.4, grassY1 - lH, lW * 0.8, lH);
      ctx.fillRect(lx2 - lW * 0.4, grassY1 - lH, lW * 0.8, lH);
      // Light head
      ctx.fillStyle = '#aaa';
      ctx.fillRect(lx1 - lW * 1.5, grassY1 - lH - lW, lW * 3, lW);
      ctx.fillRect(lx2 - lW * 1.5, grassY1 - lH - lW, lW * 3, lW);
      // Light glow
      ctx.fillStyle = 'rgba(255,245,220,0.5)';
      ctx.beginPath();
      ctx.arc(lx1, grassY1 - lH, lW * 2.5, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.arc(lx2, grassY1 - lH, lW * 2.5, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  // ============================================================
  // START/FINISH LINE + GANTRY
  // ============================================================
  if (idx === 0) {
    const bannerH = 60 * sf;
    if (bannerH > 2) {
      const bw = seg.p1.screen.w * 2;
      const bx = seg.p1.screen.x - seg.p1.screen.w;
      const by = seg.p1.screen.y - bannerH - 20 * sf;
      // Gantry structure
      ctx.fillStyle = '#555';
      ctx.fillRect(bx, by - bannerH * 0.1, bw, bannerH * 0.08);
      // Checkered pattern
      const cellW = bw / 16;
      const cellH = bannerH * 0.15;
      for (let c = 0; c < 16; c++) {
        ctx.fillStyle = c % 2 === 0 ? '#000' : '#fff';
        ctx.fillRect(bx + c * cellW, by, cellW, cellH);
      }
      // 5 red start lights
      for (let l = 0; l < 5; l++) {
        ctx.fillStyle = '#a00';
        ctx.beginPath();
        ctx.arc(bx + bw * 0.25 + l * bw * 0.125, by - bannerH * 0.2, bannerH * 0.06, 0, Math.PI * 2);
        ctx.fill();
      }
    }
  }
}

// Stars for the sky
const stars = [];
for (let i = 0; i < 100; i++) {
  stars.push({ x: Math.random(), y: Math.random() * 0.4, size: Math.random() * 2 + 0.5, blink: Math.random() * Math.PI * 2 });
}

function drawSky() {
  const grad = ctx.createLinearGradient(0, 0, 0, H * 0.5);
  grad.addColorStop(0, COL_SKY1);
  grad.addColorStop(1, COL_SKY2);
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H * 0.5);

  // Stars
  const t = performance.now() / 1000;
  ctx.fillStyle = '#fff';
  for (const s of stars) {
    const alpha = 0.5 + 0.5 * Math.sin(t * 2 + s.blink);
    ctx.globalAlpha = alpha;
    ctx.fillRect(s.x * W, s.y * H, s.size, s.size);
  }
  ctx.globalAlpha = 1;

  // Abu Dhabi skyline silhouette
  ctx.fillStyle = '#12122a';
  ctx.beginPath();
  ctx.moveTo(0, H * 0.47);
  for (let x = 0; x <= W; x += 20) {
    // City skyline with towers
    const base = Math.sin(x * 0.002) * 10 + Math.sin(x * 0.005) * 5;
    const tower = (Math.sin(x * 0.03) > 0.7) ? 30 + Math.sin(x * 0.07) * 15 : 0;
    ctx.lineTo(x, H * 0.44 - base - tower);
  }
  ctx.lineTo(W, H * 0.5);
  ctx.lineTo(0, H * 0.5);
  ctx.closePath();
  ctx.fill();
}

// Sparks/particles
const particles = [];
function spawnSpark(x, y) {
  for (let i = 0; i < 3; i++) {
    particles.push({
      x, y,
      vx: (Math.random() - 0.5) * 5,
      vy: -Math.random() * 3 - 1,
      life: 20 + Math.random() * 20,
      color: Math.random() > 0.5 ? '#ff0' : '#f80',
    });
  }
}

function updateParticles() {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx;
    p.y += p.vy;
    p.vy += 0.15;
    p.life--;
    if (p.life <= 0) particles.splice(i, 1);
  }
}

function drawParticles() {
  for (const p of particles) {
    ctx.globalAlpha = p.life / 40;
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x, p.y, 3, 3);
  }
  ctx.globalAlpha = 1;
}

// Sound effects using Web Audio
let audioCtx;
function initAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
}

function playEngineSound(speed, maxSpeed) {
  if (!audioCtx) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = 'sawtooth';
  osc.frequency.value = 40 + (speed / maxSpeed) * 120;
  gain.gain.value = 0.03;
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start();
  osc.stop(audioCtx.currentTime + 0.05);
}

function playCrash() {
  if (!audioCtx) return;
  const bufSize = audioCtx.sampleRate * 0.2;
  const buf = audioCtx.createBuffer(1, bufSize, audioCtx.sampleRate);
  const data = buf.getChannelData(0);
  for (let i = 0; i < bufSize; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / bufSize);
  const src = audioCtx.createBufferSource();
  const gain = audioCtx.createGain();
  src.buffer = buf;
  gain.gain.value = 0.2;
  src.connect(gain);
  gain.connect(audioCtx.destination);
  src.start();
}

function playLapSound() {
  if (!audioCtx) return;
  [440, 554, 659, 880].forEach((freq, i) => {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'square';
    osc.frequency.value = freq;
    gain.gain.value = 0.08;
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.15 * (i + 1) + 0.1);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start(audioCtx.currentTime + 0.15 * i);
    osc.stop(audioCtx.currentTime + 0.15 * (i + 1) + 0.1);
  });
}

      isPlayer: false,
    });
  }

  // Sort by z position descending (furthest ahead = P1)
  standings.sort((a, b) => b.z - a.z);

  // Build HTML - show top 5 around player
  const playerIdx = standings.findIndex(s => s.isPlayer);
  const playerPos = playerIdx + 1;

  let html = `<div class="lb-title">POSITIONS &nbsp; LAP: ${player.lap}/${TOTAL_LAPS}</div>`;

  for (let i = 0; i < standings.length; i++) {
    const s = standings[i];
    const cls = s.isPlayer ? ' player' : '';
    const surname = s.name.split(' ').pop();
    html += `<div class="lb-row${cls}"><span class="lb-pos">${i + 1}.</span><span class="lb-color" style="background:${s.color};"></span><span class="lb-name">${surname}</span></div>`;
  }

  leaderboardEl.innerHTML = html;

}

function getPlayerPosition() {
  let pos = 1;
  for (const car of AI_CARS) {
    if (car.z > player.z) pos++;
  }
  return pos;
}

function update(dt) {
  if (gameState !== 'racing') return;

  const speedPct = player.speed / player.maxSpeed;

  // No fuel = car dies
  if (player.fuel <= 0) {
    player.speed = Math.max(0, player.speed - 15 * dt);
    player.speed = Math.max(0, player.speed);
    player.z += player.speed * dt;
    updateParticles();
    updateLeaderboard();
    return;
  }

  // Dead tires = massive speed/grip penalty
  if (player.tireWear >= 1) {
    player.maxSpeed = player.baseMaxSpeed * 0.4;
    player.turnSpeed = player.baseTurnSpeed * 0.3;
  }

  // Acceleration
  if (keys['arrowup'] || keys['w']) {
    player.speed += player.accel * dt;
  } else if (keys['arrowdown'] || keys['s']) {
    player.speed -= player.brake * dt;
  } else {
    player.speed -= player.decel * dt;
  }

  player.speed = Math.max(0, Math.min(player.speed, player.maxSpeed));

  // Steering - smooth interpolation instead of instant snap
  let steerInput = 0;
  if (keys['arrowleft'] || keys['a'] || touchState.left) steerInput = -1;
  if (keys['arrowright'] || keys['d'] || touchState.right) steerInput = 1;

  // Touch: auto-accelerate on mobile
  if (touchState.left || touchState.right) {
    if (player.speed < player.maxSpeed * 0.7) player.speed += player.accel * dt;
  }

  // Smooth steering: ease into turns, snap back on release
  if (steerInput !== 0) {
    player.steerSmooth += (steerInput - player.steerSmooth) * 0.02 * dt;
  } else {
    player.steerSmooth *= 0.85; // fast decay to zero
    if (Math.abs(player.steerSmooth) < 0.01) player.steerSmooth = 0;
  }

  const currentSeg = segments[Math.floor(player.z / SEG_LENGTH) % TOTAL_SEGMENTS];
  const centrifugal = currentSeg ? currentSeg.curve * speedPct * speedPct * 0.03 : 0;

  player.x += player.steerSmooth * player.turnSpeed * speedPct * dt * 0.4;
  player.x -= centrifugal * dt;

  // Guardrails - clamp player to road edges and bounce back
  const ROAD_EDGE = 1.1;
  if (Math.abs(player.x) > ROAD_EDGE) {
    player.x = Math.sign(player.x) * ROAD_EDGE;
    player.speed *= 0.85;
    // Sparks on guardrail hit
    if (player.speed > 20) {
      const side = player.x > 0 ? 1 : -1;
      spawnSpark(W / 2 + side * W * 0.12, H * 0.78);
      playCrash();
    }
  }

  player.speed = Math.max(0, player.speed);

  // Move forward
  player.z += player.speed * dt;

  // Lap detection
  const totalDist = player.z;
  const currentLapDist = totalDist - player.lastLapZ;
  if (currentLapDist >= LAP_LENGTH) {
    player.lastLapZ += LAP_LENGTH;
    player.lap++;
    playLapSound();
    if (player.lap > TOTAL_LAPS) {
      player.finalPosition = getPlayerPosition();
      gameState = 'gameover';
      gameOverReason = 'finish';
      showOverlay();
      return;
    }
  }

  // AI cars - no wrapping, track total distance like player
  for (const car of AI_CARS) {
    car.z += car.speed * dt;
  }

  // Collision with AI cars (with cooldown to prevent repeated hits)
  if (player.collisionCooldown > 0) {
    player.collisionCooldown -= dt;
  } else {
    for (const car of AI_CARS) {
      const dzSigned = car.z - player.z; // positive = car is ahead
      const dz = Math.abs(dzSigned);
      if (dz < SEG_LENGTH * 3) {
        // Only collide when car is nearby: tight ahead, very tight behind
        if ((dzSigned >= 0 && dz < SEG_LENGTH * 0.3) || (dzSigned < 0 && dz < SEG_LENGTH * 0.1)) {
          const dx = Math.abs(player.x - car.offset);
          if (dx < 0.25) {
            // If hitting from behind, match the AI car's speed (can't pass through)
            if (dzSigned >= 0 && player.speed > car.speed) {
              player.speed = car.speed * 0.9;
            } else {
              player.speed *= 0.5;
            }
            player.collisionCooldown = 5;
            playCrash();
            for (let i = 0; i < 10; i++) spawnSpark(W / 2, H * 0.75);
            break;
          }
        }
      }
    }
  }

  // Tire wear and fuel consumption
  const distTraveled = player.speed * dt;
  if (distTraveled > 0) {
    const t = TIRES[player.tire];
    player.tireWear = Math.min(1, player.tireWear + t.wearRate * dt * 0.01);
    player.fuel = Math.max(0, player.fuel - 0.0003 * dt);
    applyTireAndFuel();
  }

  // Pit lane detection (pit entry near end of lap, segments ~1470-1550, steer left)
  const trackLen = TOTAL_SEGMENTS * SEG_LENGTH;
  const playerSegNorm = Math.floor((player.z % trackLen) / SEG_LENGTH);
  const inPitZone = playerSegNorm >= 1450 && playerSegNorm <= 1570;
  const pitHintEl = document.getElementById('pitHint');

  if (inPitZone && player.pitCooldown <= 0) {
    pitHintEl.style.display = 'block';
    if (player.x < -0.7) {
      // Enter pit
      pitHintEl.style.display = 'none';
      enterPitStop();
      return;
    }
  } else {
    pitHintEl.style.display = 'none';
  }
  if (player.pitCooldown > 0) player.pitCooldown -= dt;

  // Update tire/fuel HUD
  const tireHud = document.getElementById('tireHud');
  const fuelHud = document.getElementById('fuelHud');
  const tireInfo = TIRES[player.tire];
  const wearPct = Math.floor((1 - player.tireWear) * 100);
  const fuelPct = Math.floor(player.fuel * 100);
  tireHud.innerHTML = `<span style="color:${tireInfo.color};">&#9679;</span> ${tireInfo.label}: ${wearPct}%`;
  fuelHud.innerHTML = `&#9981; FUEL: ${fuelPct}%`;
  tireHud.style.display = 'block';
  fuelHud.style.display = 'block';

  // Engine sound
  engineSoundTimer += dt;
  if (engineSoundTimer > 0.06 && player.speed > 5) {
    playEngineSound(player.speed, player.maxSpeed);
    engineSoundTimer = 0;
  }

  // Update leaderboard
  updateLeaderboard();

  updateParticles();
}

function drawCockpit() {
  const color = player.color || '#e22';
  const steer = player.steerSmooth || 0;

  // Halo center pillar
  ctx.fillStyle = '#222';
  ctx.beginPath();
  ctx.moveTo(W * 0.47, H * 0.35);
  ctx.lineTo(W * 0.53, H * 0.35);
  ctx.lineTo(W * 0.515, H * 0.55);
  ctx.lineTo(W * 0.485, H * 0.55);
  ctx.closePath();
  ctx.fill();

  // Halo arms (V shape going to sides)
  ctx.strokeStyle = '#333';
  ctx.lineWidth = Math.max(4, W * 0.005);
  ctx.beginPath();
  ctx.moveTo(W * 0.485, H * 0.55);
  ctx.quadraticCurveTo(W * 0.3, H * 0.58, W * 0.08, H * 0.62);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(W * 0.515, H * 0.55);
  ctx.quadraticCurveTo(W * 0.7, H * 0.58, W * 0.92, H * 0.62);
  ctx.stroke();

  // Nose/chassis in front (bottom of screen)
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.moveTo(0, H);
  ctx.lineTo(0, H * 0.78);
  ctx.quadraticCurveTo(W * 0.15, H * 0.72, W * 0.35, H * 0.73);
  ctx.lineTo(W * 0.65, H * 0.73);
  ctx.quadraticCurveTo(W * 0.85, H * 0.72, W, H * 0.78);
  ctx.lineTo(W, H);
  ctx.closePath();
  ctx.fill();

  // Darker top edge of chassis
  ctx.fillStyle = 'rgba(0,0,0,0.3)';
  ctx.beginPath();
  ctx.moveTo(0, H * 0.78);
  ctx.quadraticCurveTo(W * 0.15, H * 0.72, W * 0.35, H * 0.73);
  ctx.lineTo(W * 0.65, H * 0.73);
  ctx.quadraticCurveTo(W * 0.85, H * 0.72, W, H * 0.78);
  ctx.lineTo(W, H * 0.80);
  ctx.quadraticCurveTo(W * 0.85, H * 0.74, W * 0.65, H * 0.75);
  ctx.lineTo(W * 0.35, H * 0.75);
  ctx.quadraticCurveTo(W * 0.15, H * 0.74, 0, H * 0.80);
  ctx.closePath();
  ctx.fill();

  // Steering wheel
  ctx.save();
  ctx.translate(W * 0.5, H * 0.88);
  ctx.rotate(steer * 0.3);

  // Wheel body (rectangular F1 style)
  const swW = W * 0.12;
  const swH = H * 0.06;
  ctx.fillStyle = '#1a1a1a';
  ctx.beginPath();
  ctx.roundRect(-swW, -swH, swW * 2, swH * 2, swH * 0.3);
  ctx.fill();

  // Grip handles
  ctx.fillStyle = '#333';
  ctx.beginPath();
  ctx.roundRect(-swW * 1.15, -swH * 0.6, swW * 0.25, swH * 1.2, 4);
  ctx.fill();
  ctx.beginPath();
  ctx.roundRect(swW * 0.9, -swH * 0.6, swW * 0.25, swH * 1.2, 4);
  ctx.fill();

  // Center display
  ctx.fillStyle = '#000';
  ctx.fillRect(-swW * 0.55, -swH * 0.65, swW * 1.1, swH * 1.3);

  // Speed on display
  ctx.fillStyle = '#0f0';
  ctx.font = `bold ${Math.max(10, Math.floor(swH * 0.8))}px monospace`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(Math.floor(player.speed), 0, -swH * 0.15);

  // Gear indicator
  const gear = player.speed < 1 ? 'N' : player.speed < 50 ? '1' : player.speed < 90 ? '2' : player.speed < 130 ? '3' : player.speed < 170 ? '4' : '5';
  ctx.fillStyle = '#f00';
  ctx.font = `bold ${Math.max(8, Math.floor(swH * 0.5))}px monospace`;
  ctx.fillText(gear, 0, swH * 0.45);

  // Buttons on wheel
  ctx.fillStyle = '#e00';
  ctx.beginPath();
  ctx.arc(-swW * 0.3, -swH * 0.15, swH * 0.15, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#00e';
  ctx.beginPath();
  ctx.arc(swW * 0.3, -swH * 0.15, swH * 0.15, 0, Math.PI * 2);
  ctx.fill();

  // Top marker stripe
  ctx.fillStyle = color;
  ctx.fillRect(-swW * 0.15, -swH * 0.95, swW * 0.3, swH * 0.15);

  ctx.restore();

  // Side mirrors
  // Left mirror
  ctx.fillStyle = '#222';
  ctx.beginPath();
  ctx.moveTo(W * 0.05, H * 0.6);
  ctx.lineTo(W * 0.12, H * 0.58);
  ctx.lineTo(W * 0.12, H * 0.65);
  ctx.lineTo(W * 0.05, H * 0.67);
  ctx.closePath();
  ctx.fill();
  ctx.fillStyle = '#335';
  ctx.fillRect(W * 0.055, H * 0.605, W * 0.06, H * 0.055);

  // Right mirror
  ctx.fillStyle = '#222';
  ctx.beginPath();
  ctx.moveTo(W * 0.95, H * 0.6);
  ctx.lineTo(W * 0.88, H * 0.58);
  ctx.lineTo(W * 0.88, H * 0.65);
  ctx.lineTo(W * 0.95, H * 0.67);
  ctx.closePath();
  ctx.fill();
  ctx.fillStyle = '#335';
  ctx.fillRect(W * 0.885, H * 0.605, W * 0.06, H * 0.055);
}

function render() {
  ctx.clearRect(0, 0, W, H);

  drawSky();

  // Fill bottom half with grass
  ctx.fillStyle = COL_GRASS1;
  ctx.fillRect(0, H * 0.5, W, H * 0.5);

  const trackLength = TOTAL_SEGMENTS * SEG_LENGTH;
  const camZ = player.z % trackLength; // normalize camera z to one lap
  const baseSegIdx = Math.floor(camZ / SEG_LENGTH) % TOTAL_SEGMENTS;
  const cameraY = segments[baseSegIdx].p1.world.y + 600;

  // Clear car assignments
  for (let i = 0; i < DRAW_DISTANCE; i++) {
    const idx = (baseSegIdx + i) % TOTAL_SEGMENTS;
    segments[idx].cars = [];
  }

  // Assign AI cars to segments
  for (const car of AI_CARS) {
    const carZNorm = ((car.z % trackLength) + trackLength) % trackLength;
    const carSeg = Math.floor(carZNorm / SEG_LENGTH) % TOTAL_SEGMENTS;
    const rel = (carSeg - baseSegIdx + TOTAL_SEGMENTS) % TOTAL_SEGMENTS;
    if (rel < DRAW_DISTANCE) {
      segments[carSeg].cars.push(car);
    }
  }

  // Pass 1: project all segments and accumulate curve offsets (near to far)
  let curveX = 0;
  let curveDX = 0;
  for (let i = 0; i < DRAW_DISTANCE; i++) {
    const idx = (baseSegIdx + i) % TOTAL_SEGMENTS;
    const seg = segments[idx];

    // Handle wrapping
    const p1z = seg.p1.world.z < camZ ? seg.p1.world.z + TOTAL_SEGMENTS * SEG_LENGTH : seg.p1.world.z;
    const p2z = seg.p2.world.z < camZ ? seg.p2.world.z + TOTAL_SEGMENTS * SEG_LENGTH : seg.p2.world.z;

    // Temporarily set z for projection
    const origP1z = seg.p1.world.z;
    const origP2z = seg.p2.world.z;
    seg.p1.world.z = p1z;
    seg.p2.world.z = p2z;

    project(seg.p1, cameraY, camZ);
    project(seg.p2, cameraY, camZ);

    // Restore original z
    seg.p1.world.z = origP1z;
    seg.p2.world.z = origP2z;

    // Apply curve offset and player x offset to screen positions
    seg.p1.screen.x += curveX - player.x * seg.p1.screen.w;
    seg.p2.screen.x += (curveX + curveDX) - player.x * seg.p2.screen.w;

    // Store curve offset on segment for later use
    seg._curveX = curveX;

    curveX += curveDX;
    curveDX += seg.curve;
  }

  // Pass 2: draw back to front (painter's algorithm)
  for (let i = DRAW_DISTANCE - 1; i >= 0; i--) {
    const idx = (baseSegIdx + i) % TOTAL_SEGMENTS;
    const seg = segments[idx];

    if (seg.p1.screen.scale <= 0 || seg.p2.screen.scale <= 0) continue;
    if (seg.p2.screen.y >= seg.p1.screen.y) continue;
    if (seg.p1.screen.y < 0) continue;

    // Grass
    drawPoly(seg.color.grass,
      0, seg.p2.screen.y, W,
      0, seg.p1.screen.y, W);

    // Rumble strips
    const rumbleW1 = seg.p1.screen.w * 1.15;
    const rumbleW2 = seg.p2.screen.w * 1.15;
    drawPoly(seg.color.rumble,
      seg.p1.screen.x, seg.p1.screen.y, rumbleW1,
      seg.p2.screen.x, seg.p2.screen.y, rumbleW2);

    // Road
    drawPoly(seg.color.road,
      seg.p1.screen.x, seg.p1.screen.y, seg.p1.screen.w,
      seg.p2.screen.x, seg.p2.screen.y, seg.p2.screen.w);

    // Guardrail barriers
    const guardW1 = seg.p1.screen.w * 0.03;
    const guardW2 = seg.p2.screen.w * 0.03;
    const guardColor = idx % 4 < 2 ? '#cc0000' : '#cccccc';
    drawPoly(guardColor,
      seg.p1.screen.x - seg.p1.screen.w * 1.12, seg.p1.screen.y, guardW1,
      seg.p2.screen.x - seg.p2.screen.w * 1.12, seg.p2.screen.y, guardW2);
    drawPoly(guardColor,
      seg.p1.screen.x + seg.p1.screen.w * 1.12, seg.p1.screen.y, guardW1,
      seg.p2.screen.x + seg.p2.screen.w * 1.12, seg.p2.screen.y, guardW2);

    // Lane markings
    if (idx % 4 < 2) {
      const laneW1 = seg.p1.screen.w * 0.01;
      const laneW2 = seg.p2.screen.w * 0.01;
      for (let lane = -1; lane <= 1; lane += 2) {
        const lx1 = seg.p1.screen.x + seg.p1.screen.w * lane * 0.33;
        const lx2 = seg.p2.screen.x + seg.p2.screen.w * lane * 0.33;
        drawPoly(COL_LANE, lx1, seg.p1.screen.y, laneW1, lx2, seg.p2.screen.y, laneW2);
      }
    }

    // Scenery
    drawScenery(seg, seg.p1.screen.y, seg.p2.screen.y, seg.p1.screen.scale);

    // Draw AI cars on this segment
    for (const car of seg.cars) {
      // Derive scale from road width so cars are always visible and proportional
      const carScale = seg.p1.screen.w * 0.08 * 640 / (60 * W);
      const carX = seg.p1.screen.x + car.offset * seg.p1.screen.w;
      const carY = seg.p1.screen.y;
      drawCar(carX, carY, carScale, car.color, false);
    }
  }

  // Cockpit view
  drawCockpit();

  // Speed lines at high speed
  if (player.speed > player.maxSpeed * 0.8) {
    ctx.strokeStyle = 'rgba(255,255,255,0.08)';
    ctx.lineWidth = 1;
    for (let i = 0; i < 5; i++) {
      const sx = Math.random() * W;
      ctx.beginPath();
      ctx.moveTo(sx, H * 0.5);
      ctx.lineTo(sx + (sx - W / 2) * 0.3, H);
      ctx.stroke();
    }
  }

  drawParticles();

  // Always reset shadow state
  ctx.shadowColor = 'transparent';
  ctx.shadowBlur = 0;

  // Countdown
  if (countdownNumber > 0) {
    ctx.shadowColor = '#000';
    ctx.shadowBlur = 10;
    ctx.fillStyle = '#fff';
    ctx.font = `bold ${Math.floor(W * 0.15)}px monospace`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(countdownNumber.toString(), W / 2, H / 2);
    ctx.shadowColor = 'transparent';
    ctx.shadowBlur = 0;
  }
}

// Pit stop system
let pitTireChoice = 'medium';
let pitFuelChoice = 'medium';
let pitPhase = ''; // 'entering', 'stopping', 'stopped', 'work', 'exiting'
let pitTimer = 0;
let pitWorkTimer = 0;
const PIT_SPEED_LIMIT = 40;

function enterPitStop() {
  gameState = 'pitstop';
  pitPhase = 'entering';
  pitTimer = 0;
  pitTireChoice = player.tire;
  pitFuelChoice = 'medium';
  document.getElementById('pitHint').style.display = 'none';
}

function showPitMenu() {
  const pitOverlay = document.getElementById('pitOverlay');
  pitOverlay.style.display = 'flex';

  document.querySelectorAll('.tire-btn').forEach(btn => {
    btn.classList.toggle('selected', btn.dataset.tire === pitTireChoice);
    btn.onclick = () => {
      pitTireChoice = btn.dataset.tire;
      document.querySelectorAll('.tire-btn').forEach(b => b.classList.remove('selected'));
      btn.classList.add('selected');
    };
  });

  document.querySelectorAll('.fuel-btn').forEach(btn => {
    btn.classList.toggle('selected', btn.dataset.fuel === pitFuelChoice);
    btn.onclick = () => {
      pitFuelChoice = btn.dataset.fuel;
      document.querySelectorAll('.fuel-btn').forEach(b => b.classList.remove('selected'));
      btn.classList.add('selected');
    };
  });

  document.getElementById('pitConfirm').onclick = () => {
    document.getElementById('pitOverlay').style.display = 'none';
    player.tire = pitTireChoice;
    player.tireWear = 0;
    player.fuelLevel = pitFuelChoice;
    player.fuel = FUEL_LEVELS[pitFuelChoice].capacity;
    applyTireAndFuel();
    pitPhase = 'work';
    pitWorkTimer = 0;
  };
}

function updatePitStop(dt) {
  // AI cars keep moving during pit
  for (const car of AI_CARS) {
    car.z += car.speed * dt;
  }

  if (pitPhase === 'entering') {
    // Slow down into pit lane
    player.speed = Math.max(player.speed - 15 * dt, PIT_SPEED_LIMIT);
    player.z += player.speed * dt;
    player.x += (-0.7 - player.x) * 0.03 * dt; // drift to pit lane (left side)
    pitTimer += dt;
    if (pitTimer > 40) {
      pitPhase = 'stopping';
      pitTimer = 0;
    }
  } else if (pitPhase === 'stopping') {
    // Come to a stop at pit box
    player.speed = Math.max(player.speed - 8 * dt, 0);
    player.z += player.speed * dt;
    pitTimer += dt;
    if (player.speed <= 0 && pitTimer > 15) {
      pitPhase = 'stopped';
      pitTimer = 0;
      showPitMenu();
    }
  } else if (pitPhase === 'work') {
    // Tire change animation
    pitWorkTimer += dt;
    if (pitWorkTimer > 30) {
      pitPhase = 'exiting';
      pitTimer = 0;
    }
  } else if (pitPhase === 'exiting') {
    // Accelerate out
    player.speed = Math.min(player.speed + 6 * dt, PIT_SPEED_LIMIT);
    player.z += player.speed * dt;
    player.x += (0 - player.x) * 0.04 * dt; // drift back to center
    pitTimer += dt;
    if (pitTimer > 35) {
      player.hasPitted = true;
      player.pitCooldown = 50;
      player.x = 0;
      gameState = 'racing';
    }
  }

  updateLeaderboard();
}

function drawPitScene() {
  // Draw the normal track in background
  render();

  // Pit lane overlay elements
  const color = player.color || '#e22';

  if (pitPhase === 'entering' || pitPhase === 'stopping') {
    // "PIT LANE" sign
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.fillRect(W * 0.3, H * 0.05, W * 0.4, H * 0.06);
    ctx.fillStyle = '#ff0';
    ctx.font = `bold ${Math.floor(W * 0.03)}px monospace`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('PIT LANE - SPEED LIMIT 80 km/h', W * 0.5, H * 0.08);

    // Speed indicator
    ctx.fillStyle = player.speed > PIT_SPEED_LIMIT + 5 ? '#f00' : '#0f0';
    ctx.font = `bold ${Math.floor(W * 0.025)}px monospace`;
    ctx.fillText(`${Math.floor(player.speed)} km/h`, W * 0.5, H * 0.13);

    // Pit wall on right (from driver perspective in pit lane)
    ctx.fillStyle = '#555';
    ctx.fillRect(W * 0.78, H * 0.55, W * 0.05, H * 0.25);
    // Team color stripe on pit wall
    ctx.fillStyle = color;
    ctx.fillRect(W * 0.78, H * 0.55, W * 0.05, H * 0.02);
  }

  if (pitPhase === 'stopping') {
    // Pit crew waiting ahead
    const crewY = H * 0.6;
    const crewScale = Math.max(3, W * 0.008);
    for (let c = 0; c < 4; c++) {
      const cx = W * 0.4 + c * crewScale * 5;
      ctx.fillStyle = color;
      ctx.fillRect(cx - crewScale, crewY - crewScale * 4, crewScale * 2, crewScale * 4);
      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.arc(cx, crewY - crewScale * 5, crewScale, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  if (pitPhase === 'work') {
    // Pit work animation
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.fillRect(0, H * 0.3, W, H * 0.15);

    const progress = Math.min(pitWorkTimer / 30, 1);

    // "Changing tyres..." text
    ctx.fillStyle = '#ff0';
    ctx.font = `bold ${Math.floor(W * 0.035)}px monospace`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    const dots = '.'.repeat(Math.floor(pitWorkTimer / 5) % 4);
    ctx.fillText(`CHANGING TYRES${dots}`, W * 0.5, H * 0.35);

    // Progress bar
    ctx.fillStyle = '#333';
    ctx.fillRect(W * 0.3, H * 0.39, W * 0.4, H * 0.025);
    ctx.fillStyle = TIRES[pitTireChoice].color;
    ctx.fillRect(W * 0.3, H * 0.39, W * 0.4 * progress, H * 0.025);

    // Time
    ctx.fillStyle = '#fff';
    ctx.font = `${Math.floor(W * 0.02)}px monospace`;
    ctx.fillText(`${(pitWorkTimer / 10).toFixed(1)}s`, W * 0.5, H * 0.43);

    // Pit crew working (animated)
    const crewY = H * 0.72;
    const crewScale = Math.max(4, W * 0.01);
    for (let c = 0; c < 6; c++) {
      const cx = W * 0.3 + c * crewScale * 6;
      const bob = Math.sin(pitWorkTimer * 0.8 + c * 2) * crewScale;
      // Body
      ctx.fillStyle = color;
      ctx.fillRect(cx - crewScale, crewY - crewScale * 4 + bob, crewScale * 2, crewScale * 4);
      // Helmet
      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.arc(cx, crewY - crewScale * 5 + bob, crewScale * 1.2, 0, Math.PI * 2);
      ctx.fill();
      // Arms (animated, reaching toward car)
      ctx.strokeStyle = color;
      ctx.lineWidth = Math.max(1, crewScale * 0.5);
      ctx.beginPath();
      ctx.moveTo(cx + crewScale, crewY - crewScale * 3 + bob);
      ctx.lineTo(cx + crewScale * 3, crewY - crewScale * 2 + bob + Math.sin(pitWorkTimer + c) * crewScale);
      ctx.stroke();
    }

    // Wheel gun sparks
    if (Math.random() > 0.5) {
      for (let s = 0; s < 3; s++) {
        ctx.fillStyle = Math.random() > 0.5 ? '#ff0' : '#fff';
        ctx.fillRect(
          W * 0.35 + Math.random() * W * 0.3,
          H * 0.68 + Math.random() * H * 0.05,
          2, 2
        );
      }
    }
  }

  if (pitPhase === 'exiting') {
    ctx.fillStyle = 'rgba(0,0,0,0.4)';
    ctx.fillRect(W * 0.3, H * 0.05, W * 0.4, H * 0.06);
    ctx.fillStyle = '#0f0';
    ctx.font = `bold ${Math.floor(W * 0.03)}px monospace`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('PIT EXIT - REJOIN TRACK', W * 0.5, H * 0.08);
  }
}

function showOverlay() {
  overlay.style.display = 'block';
  leaderboardEl.style.display = 'none';
  document.getElementById('tireHud').style.display = 'none';
  document.getElementById('fuelHud').style.display = 'none';
  document.getElementById('pitHint').style.display = 'none';
  if (gameState === 'gameover' && gameOverReason === 'finish') {
    const team = TEAMS[selectedTeam];
    overlay.innerHTML = `
      <h1 style="color:#0f0">RACE COMPLETE!</h1>
      <div>Driver: <span style="color:${team.accent}">${team.name}</span> | ${team.team}</div>
      <div>Finished P${player.finalPosition} of 22</div>
      <button class="start-btn" id="restartBtn" style="margin-right:8px;">RACE AGAIN</button>
      <button class="start-btn" id="changeTeamBtn" style="background:#555;">CHANGE DRIVER</button>
    `;
    document.getElementById('restartBtn').addEventListener('click', startQuali);
    document.getElementById('changeTeamBtn').addEventListener('click', () => {
      overlay.innerHTML = `
        <h1>RETRO GRAND PRIX</h1>
        <div class="sub">--- F1 RACING 1986 ---</div>
        <div id="teamScreen">
          <div style="margin-bottom:10px; color:#aaa;">CHOOSE YOUR DRIVER</div>
          <div class="team-grid" id="teamGrid"></div>
          <button class="start-btn" id="raceBtn2">NEXT</button>
        </div>
      `;
      buildTeamGrid();
      document.getElementById('raceBtn2').addEventListener('click', () => {
        showSetupScreen();
      });
    });
  }
}

// Build team selection grid
function buildTeamGrid() {
  const grid = document.getElementById('teamGrid');
  grid.innerHTML = '';
  TEAMS.forEach((team, i) => {
    const card = document.createElement('div');
    card.className = 'team-card' + (i === selectedTeam ? ' selected' : '');
    const spdPct = ((team.maxSpeed - 180) / 40 * 100);
    const accPct = ((team.accel - 4) / 2.5 * 100);
    const hndPct = ((team.turnSpeed - 0.3) / 0.25 * 100);
    card.innerHTML = `
      <div class="team-color-bar" style="background:${team.color};"></div>
      <div class="team-name" style="color:${team.accent};">${team.name}</div>
      <div class="team-stats">
        SPD <span class="bar-bg"><span class="bar-fill" style="width:${spdPct}%;background:${team.color};"></span></span><br>
        ACC <span class="bar-bg"><span class="bar-fill" style="width:${accPct}%;background:${team.color};"></span></span><br>
        HND <span class="bar-bg"><span class="bar-fill" style="width:${hndPct}%;background:${team.color};"></span></span><br>
        <span style="color:#888;">${team.team}</span>
      </div>
    `;
    card.addEventListener('click', () => {
      selectedTeam = i;
      grid.querySelectorAll('.team-card').forEach(c => c.classList.remove('selected'));
      card.classList.add('selected');
      document.getElementById('raceBtn').style.display = '';
    });
    grid.appendChild(card);
  });
}

function showTeamSelect() {
  initAudio();
  document.getElementById('menuScreen').style.display = 'none';
  document.getElementById('teamScreen').style.display = '';
  buildTeamGrid();
}

let startTire = 'medium';
let startFuel = 'full';
let qualiStartZ = 0;
let qualiTime = 0;
let qualiResults = []; // { name, color, time }
let qualiGridOrder = []; // ordered TEAMS indices for grid
let qualiLapStarted = false;

function formatTime(t) {
  const mins = Math.floor(t / 60);
  const secs = Math.floor(t % 60);
  const ms = Math.floor((t % 1) * 1000);
  return `${mins}:${secs.toString().padStart(2, '0')}.${ms.toString().padStart(3, '0')}`;
}

function startQuali() {
  buildTrack();
  resetPlayer();
  player.tire = 'soft'; // quali always on softs
  player.tireWear = 0;
  player.fuelLevel = 'low'; // light fuel for quali
  player.fuel = FUEL_LEVELS['low'].capacity;
  applyTireAndFuel();
  AI_CARS.length = 0; // empty track for quali
  particles.length = 0;
  overlay.style.display = 'none';
  leaderboardEl.style.display = 'none';
  document.getElementById('qualiHud').style.display = 'block';
  document.getElementById('tireHud').style.display = 'none';
  document.getElementById('fuelHud').style.display = 'none';
  qualiTime = 0;
  qualiLapStarted = false;
  qualiStartZ = 0;
  gameState = 'qualifying';
  countdownNumber = 3;

  const countdownInterval = setInterval(() => {
    countdownNumber--;
    if (countdownNumber <= 0) {
      clearInterval(countdownInterval);
      countdownNumber = 0;
    }
  }, 1000);
}

function updateQuali(dt) {
  if (countdownNumber > 0) return;

  const speedPct = player.speed / player.maxSpeed;

  // Acceleration
  if (keys['arrowup'] || keys['w']) {
    player.speed += player.accel * dt;
  } else if (keys['arrowdown'] || keys['s']) {
    player.speed -= player.brake * dt;
  } else {
    player.speed -= player.decel * dt;
  }
  player.speed = Math.max(0, Math.min(player.speed, player.maxSpeed));

  // Steering
  let steerInput = 0;
  if (keys['arrowleft'] || keys['a'] || touchState.left) steerInput = -1;
  if (keys['arrowright'] || keys['d'] || touchState.right) steerInput = 1;
  if (touchState.left || touchState.right) {
    if (player.speed < player.maxSpeed * 0.7) player.speed += player.accel * dt;
  }
  if (steerInput !== 0) {
    player.steerSmooth += (steerInput - player.steerSmooth) * 0.02 * dt;
  } else {
    player.steerSmooth *= 0.85;
    if (Math.abs(player.steerSmooth) < 0.01) player.steerSmooth = 0;
  }

  const currentSeg = segments[Math.floor(player.z / SEG_LENGTH) % TOTAL_SEGMENTS];
  const centrifugal = currentSeg ? currentSeg.curve * speedPct * speedPct * 0.03 : 0;
  player.x += player.steerSmooth * player.turnSpeed * speedPct * dt * 0.4;
  player.x -= centrifugal * dt;

  const ROAD_EDGE = 1.1;
  if (Math.abs(player.x) > ROAD_EDGE) {
    player.x = Math.sign(player.x) * ROAD_EDGE;
    player.speed *= 0.85;
  }
  player.speed = Math.max(0, player.speed);
  player.z += player.speed * dt;

  // Lap timing
  if (!qualiLapStarted && player.z > SEG_LENGTH * 5) {
    qualiLapStarted = true;
    qualiStartZ = player.z;
    qualiTime = 0;
  }

  if (qualiLapStarted) {
    qualiTime += dt / 20; // convert back to real seconds (dt was multiplied by 20)
    const lapDist = player.z - qualiStartZ;
    if (lapDist >= LAP_LENGTH) {
      finishQuali();
      return;
    }
  }

  // Update timer display
  document.getElementById('qualiTimer').textContent = formatTime(qualiTime);

  updateParticles();
}

function finishQuali() {
  const playerTime = qualiTime;
  const playerTeam = TEAMS[selectedTeam];

  // Generate AI times based on their stats
  qualiResults = [];
  TEAMS.forEach((driver, i) => {
    if (i === selectedTeam) {
      qualiResults.push({ name: driver.name, color: driver.color, time: playerTime, idx: i, isPlayer: true });
    } else {
      // Simulate time: faster cars get lower times, with some randomness
      const baseTime = playerTime * (1 + (220 - driver.maxSpeed) / 200 + (Math.random() - 0.5) * 0.08);
      qualiResults.push({ name: driver.name, color: driver.color, time: baseTime, idx: i, isPlayer: false });
    }
  });

  qualiResults.sort((a, b) => a.time - b.time);
  qualiGridOrder = qualiResults.map(r => r.idx);

  // Show results
  document.getElementById('qualiHud').style.display = 'none';
  gameState = 'menu';
  overlay.style.display = 'block';

  const playerPos = qualiResults.findIndex(r => r.isPlayer) + 1;
  let gridHtml = `
    <h1 style="color:#f0f;">QUALIFYING RESULTS</h1>
    <div class="sub">Your position: P${playerPos}</div>
    <div class="quali-grid">
  `;
  qualiResults.forEach((r, i) => {
    const cls = r.isPlayer ? 'qg-player' : '';
    const surname = r.name.split(' ').pop();
    gridHtml += `
      <span class="qg-pos">${i + 1}.</span>
      <span class="qg-color" style="background:${r.color};"></span>
      <span class="qg-name ${cls}">${surname}</span>
      <span class="qg-time ${cls}">${formatTime(r.time)}</span>
    `;
  });
  gridHtml += `</div><button class="start-btn" id="startRaceBtn">START RACE</button>`;

  const qualiScreen = document.getElementById('qualiResultScreen');
  qualiScreen.innerHTML = gridHtml;
  qualiScreen.style.display = '';
  document.getElementById('menuScreen').style.display = 'none';
  document.getElementById('teamScreen').style.display = 'none';
  document.getElementById('setupScreen').style.display = 'none';

  document.getElementById('startRaceBtn').onclick = () => {
    qualiScreen.style.display = 'none';
    showSetupScreen();
  };
}

function showSetupScreen() {
  overlay.style.display = 'block';
  document.getElementById('menuScreen').style.display = 'none';
  document.getElementById('teamScreen').style.display = 'none';
  document.getElementById('qualiResultScreen').style.display = 'none';
  document.getElementById('setupScreen').style.display = '';

  startTire = 'medium';
  startFuel = 'full';

  document.querySelectorAll('.setup-tire').forEach(btn => {
    btn.classList.toggle('selected', btn.dataset.tire === startTire);
    btn.onclick = () => {
      startTire = btn.dataset.tire;
      document.querySelectorAll('.setup-tire').forEach(b => b.classList.remove('selected'));
      btn.classList.add('selected');
    };
  });

  document.querySelectorAll('.setup-fuel').forEach(btn => {
    btn.classList.toggle('selected', btn.dataset.fuel === startFuel);
    btn.onclick = () => {
      startFuel = btn.dataset.fuel;
      document.querySelectorAll('.setup-fuel').forEach(b => b.classList.remove('selected'));
      btn.classList.add('selected');
    };
  });
}

function startRaceFromGrid() {
  buildTrack();
  resetPlayer();
  player.tire = startTire;
  player.tireWear = 0;
  player.fuelLevel = startFuel;
  player.fuel = FUEL_LEVELS[startFuel].capacity;
  applyTireAndFuel();
  spawnAICars(qualiGridOrder.length > 0 ? qualiGridOrder : null);
  particles.length = 0;
  overlay.style.display = 'none';
  leaderboardEl.style.display = 'block';
  leaderboardTimer = 0;
  gameState = 'countdown';
  countdownNumber = 3;
  countdownTimer = 0;

  const countdownInterval = setInterval(() => {
    countdownNumber--;
    if (countdownNumber <= 0) {
      clearInterval(countdownInterval);
      countdownNumber = 0;
      gameState = 'racing';
    }
  }, 1000);
}

startBtn.addEventListener('click', showTeamSelect);
document.getElementById('raceBtn').addEventListener('click', () => {
  startQuali();
});
document.getElementById('goBtn').addEventListener('click', () => {
  startRaceFromGrid();
});

// Game loop
function gameLoop(timestamp) {
  const dt = Math.min((timestamp - lastTime) / 1000, 0.05);
  lastTime = timestamp;

  const gameDt = dt * 20;
  if (gameState === 'qualifying') {
    updateQuali(gameDt);
    render();
  } else if (gameState === 'pitstop') {
    updatePitStop(gameDt);
    drawPitScene();
  } else {
    update(gameDt);
    render();
  }
  requestAnimationFrame(gameLoop);
}

// Init
buildTrack();
resetPlayer();
lastTime = performance.now();
requestAnimationFrame(gameLoop);
</script>
